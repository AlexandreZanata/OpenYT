name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and Android build
        run: >
          ./gradlew
          :core:desktopTest
          :engine-ytdlp:desktopTest
          :desktopApp:test
          :androidApp:assembleDebug
          --console=plain
          --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clipbau-debug-apk
          path: androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  desktop-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile desktop app
        run: ./gradlew :desktopApp:compileKotlin --console=plain --stacktrace
