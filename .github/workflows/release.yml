name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      value: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: |
          echo "value=$(grep '^openyt.version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

  android:
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare optional signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/openyt.jks"
          echo "OPENYT_KEYSTORE_PATH=$RUNNER_TEMP/openyt.jks" >> "$GITHUB_ENV"
      - name: Build release APK
        env:
          OPENYT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          OPENYT_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          OPENYT_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease --console=plain --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error

  desktop:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            task: packageDeb
            artifact: linux-deb
            path: desktopApp/build/compose/binaries/main/deb/*.deb
          - os: windows-latest
            task: packageMsi
            artifact: windows-msi
            path: desktopApp/build/compose/binaries/main/msi/*.msi
          - os: macos-latest
            task: packageDmg
            artifact: macos-dmg
            path: desktopApp/build/compose/binaries/main/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install wixtoolset --no-progress -y
      - name: Package desktop
        shell: bash
        run: ./gradlew :desktopApp:${{ matrix.task }} --console=plain --stacktrace
      - name: Show packaging logs on failure
        if: failure()
        shell: bash
        run: |
          uname -a || true
          sw_vers || true
          "$JAVA_HOME/bin/jpackage" --version || true
          echo "----- args"
          cat desktopApp/build/compose/tmp/createDistributable.args.txt || true
          echo "----- logs"
          for f in desktopApp/build/compose/logs/createDistributable/*.txt; do
            echo "----- $f"
            cat "$f" || true
          done
          ls -la desktopApp/build/compose/binaries/main/app || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error

  publish:
    needs: [version, android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.value }}
          name: OpenYT v${{ needs.version.outputs.value }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
