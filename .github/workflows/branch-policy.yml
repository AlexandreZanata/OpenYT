name: Branch policy

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  source-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Require dev as the source branch
        run: |
          if [ "${{ github.head_ref }}" != "dev" ]; then
            echo "Pull requests to main must come from the dev branch (got '${{ github.head_ref }}')."
            exit 1
          fi
          echo "Source branch is dev."
